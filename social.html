<!DOCTYPE html>
<html>
<head>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My Social App</title>

  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f0f2f5;
    }

    header {
      background: #1877f2;
      color: white;
      padding: 18px;
      text-align: center;
      font-size: 24px;
      font-weight: bold;
    }

    .container {
      max-width: 600px;
      margin: 20px auto;
      padding: 10px;
    }

    .box {
      background: white;
      padding: 15px;
      margin-bottom: 15px;
      border-radius: 10px;
    }

    textarea {
      width: 100%;
      box-sizing: border-box;
      padding: 12px;
      border: 1px solid #ccc;
      border-radius: 8px;
      font-size: 16px;
    }

    button {
      margin-top: 10px;
      padding: 10px 18px;
      border: none;
      border-radius: 6px;
      background: #1877f2;
      color: white;
      font-size: 16px;
    }

    .post {
      background: white;
      padding: 15px;
      margin-top: 15px;
      border-radius: 10px;
    }
  </style>
</head>

<body>

  <header>
    My Social App
  </header>

  <div class="container">

    <div class="box">
      <h3>Create a Post</h3>

      <textarea id="postText"
        rows="4"
        placeholder="What's on your mind?"></textarea>

      <button onclick="createPost()">Post</button>
    </div>

    <div id="posts">

      <div class="post">
        <h3>Welcome!</h3>
        <p>Welcome to My Social App.</p>
        <button onclick="likePost(this)">👍 Like</button>
      </div>

    </div>

  </div>

  <script>
    function createPost() {
      let text = document.getElementById("postText").value;

      if (text.trim() === "") {
        alert("Please write something.");
        return;
      }

      let post = document.createElement("div");

      post.className = "post";

      post.innerHTML =
        "<h3>New User</h3>" +
        "<p>" + text + "</p>" +
        "<button onclick='likePost(this)'>👍 Like</button>";

      document.getElementById("posts").prepend(post);

      document.getElementById("postText").value = "";
    }

    function likePost(button) {
      button.innerHTML = "❤️ Liked";
    }
  </script>

</body>
</html>
